name: Native Linux Build
on:
  push:
    branches: [native-linux, main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 and C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev libqt6opengl6-dev xvfb xauth libgl1-mesa-dri
      - name: Configure (native GUI)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build all
        run: cmake --build build --parallel 2
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Native start page smoke test
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/magneticraft2-studio --home-smoke --screenshot build/studio-home.png
      - name: Native GUI startup smoke test (software OpenGL)
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/magneticraft2-studio --smoke --screenshot build/studio-native.png
      - name: Native Model workspace drawing interaction test
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/studio-model-ui-tests build/studio-model-draw.png
      - name: Native transform gizmo and UV editor interaction test
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/studio-gizmos-uv-tests build/studio-textured.png
      - name: Ore Washer reference model import screenshot
        run: timeout 20s env LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/magneticraft2-studio --sample-washer --smoke --screenshot build/studio-washer.png
      - name: Native editor UX smoke test (workspaces/outliner)
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/studio-editor-ui-tests build/studio-editor-ux.png build/studio-uv-workspace.png
      - name: Six-face UV overview mouse test
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/studio-uv-overview-tests build/studio-uv-six-faces.png
      - name: Preserve GUI preview
        uses: actions/upload-artifact@v4
        with:
          name: magneticraft2-studio-native-preview
          path: |
            build/studio-home.png
            build/studio-native.png
            build/studio-model-draw.png
            build/studio-editor-ux.png
            build/studio-washer.png
            build/studio-textured.png
            build/studio-uv-six-faces.png\n            build/studio-uv-workspace.png
